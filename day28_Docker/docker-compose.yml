
services:
  # MySQL 数据库
  mysql:
    image: mysql:8.4
    container_name: day28-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - day28-network

  # FastAPI 后端
  app:
    build:
      context: ..
      dockerfile: day28_Docker/Dockerfile

    container_name: day28-fastapi
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - day28-network

# 数据持久化
volumes:
  mysql_data:

# Docker 内部网络
networks:
  day28-network:
    driver: bridge
